name: Build OLX Automator APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix folder paths automatically
        run: |
          mkdir -p app/src/main/java/com/olx/automator
          if [ -f "app/src/main/app/src/main/java/com/olx/automator/MainActivity.java" ]; then
            mv app/src/main/app/src/main/java/com/olx/automator/MainActivity.java app/src/main/java/com/olx/automator/MainActivity.java
            rm -rf app/src/main/app
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate root Gradle config automatically
        run: |
          echo "rootProject.name = 'OLXAutomator'" > settings.gradle
          echo "include ':app'" >> settings.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          echo "android.useAndroidX=true" > gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: OLX-Automator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
